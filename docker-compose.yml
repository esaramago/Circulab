# Circulab (Astro SSR). Copy .env.example to .env and fill values before production use.
# Run: docker compose up --build

services:
  circulab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
        PUBLIC_SUPABASE_PROJECT_ID: ${PUBLIC_SUPABASE_PROJECT_ID:-}
        PUBLIC_CAN_SUGGEST: ${PUBLIC_CAN_SUGGEST:-}
        PUBLIC_BASEMAPS_API_KEY: ${PUBLIC_BASEMAPS_API_KEY:-}
        SITE: ${SITE:-}
    image: circulab:latest
    container_name: circulab
    ports:
      - "${HOST_PORT:-4321}:4321"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"
      SITE: ${SITE:-http://localhost:4321}
    restart: unless-stopped
